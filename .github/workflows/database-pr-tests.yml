name: Database Pull Request Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "01_Docker/**"
      - "02_Database/**"
      - "03_Tests/**"
      - "04_Run/**"
      - ".github/workflows/database-pr-tests.yml"
  # Run it by hand to show a good change passing and a bad AI change failing.
  workflow_dispatch:
    inputs:
      change:
        description: Change script to test
        type: choice
        options:
          - good
          - bad
        default: good

jobs:
  database-tests:
    name: Run SQL validation tests
    runs-on: ubuntu-latest
    env:
      SQL_SA_PASSWORD: ${{ secrets.SQL_SA_PASSWORD }}
      CHANGE_SCRIPT: 02_Database/changes/004_ai_generated_${{ inputs.change || 'good' }}_change.sql

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.SQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c '</dev/tcp/localhost/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check the SQL password secret
        run: |
          if [[ -z "${SQL_SA_PASSWORD}" ]]; then
            echo "::error::Add a SQL_SA_PASSWORD repository secret. See 04_Automation/03_Database_Tests.md."
            exit 1
          fi

      - name: Install sqlcmd
        shell: bash
        run: |
          set -euo pipefail
          if command -v sqlcmd >/dev/null 2>&1; then
            echo "sqlcmd already installed."
            exit 0
          fi
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/microsoft-prod.list >/dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "${GITHUB_PATH}"

      - name: Make scripts executable
        run: chmod +x 01_Docker/*.sh 04_Run/*.sh

      - name: Wait for SQL Server
        env:
          SQL_SERVER: localhost
          SQL_PORT: 1433
          SQL_USER: sa
          SQL_PASSWORD: ${{ env.SQL_SA_PASSWORD }}
        run: ./01_Docker/01_wait-for-sqlserver.sh

      - name: Run database tests
        env:
          SQL_SERVER: localhost
          SQL_PORT: 1433
          SQL_USER: sa
          SQL_PASSWORD: ${{ env.SQL_SA_PASSWORD }}
        run: ./04_Run/run-tests.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-test-results
          path: test-results/
          if-no-files-found: warn
