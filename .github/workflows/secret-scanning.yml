name: Secret Scanning

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  gitleaks:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare scan range for root commits
        id: scan-range
        if: github.event_name == 'push'
        env:
          FIRST_COMMIT: ${{ github.event.commits[0].id }}
        run: |
          if [ -n "$FIRST_COMMIT" ] && ! git rev-parse --verify "${FIRST_COMMIT}^" >/dev/null 2>&1; then
            empty_tree=$(git mktree </dev/null)
            anchor=$(git -c user.name=Gitleaks -c user.email=gitleaks@example.invalid commit-tree "$empty_tree" -m "Gitleaks scan anchor")
            base=$(git -c user.name=Gitleaks -c user.email=gitleaks@example.invalid commit-tree "$empty_tree" -p "$anchor" -m "Gitleaks scan boundary")
            echo "base_ref=$base" >> "$GITHUB_OUTPUT"
          fi

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ steps.scan-range.outputs.base_ref }}
