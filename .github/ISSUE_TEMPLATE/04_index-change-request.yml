name: DBA index change request
description: Request an index create, drop, or rebuild with performance and rollback evidence.
title: "[Index Change] "
labels:
  - dba-change
  - index-change
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form for index changes only. Include before and after evidence and the exact rollback statement.
  - type: input
    id: table_name
    attributes:
      label: Target table
      placeholder: dbo.Orders
    validations:
      required: true
  - type: input
    id: index_name
    attributes:
      label: Index name
      placeholder: IX_Orders_CustomerID_OrderDate
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: Change operation
      options:
        - Create index
        - Drop index
        - Alter or rebuild index
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why this index change is needed
      placeholder: The customer order history query does a key lookup on every row and reads 48,000 pages.
    validations:
      required: true
  - type: textarea
    id: before_metrics
    attributes:
      label: Before change evidence
      description: Include the execution plan and baseline metrics.
      placeholder: Duration, CPU time, logical reads, plan hash, and the sample query.
    validations:
      required: true
  - type: textarea
    id: success_metrics
    attributes:
      label: Expected success criteria
      placeholder: Logical reads drop by at least 40 percent and CPU time drops by at least 25 percent.
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback plan
      placeholder: DROP INDEX IX_Orders_CustomerID_OrderDate ON dbo.Orders;
      render: sql
    validations:
      required: true
