name: DBA incident report
description: Track a production incident with impact, mitigation, and prevention.
title: "[DBA Incident] "
labels:
  - dba-incident
  - production
body:
  - type: markdown
    attributes:
      value: |
        Use this form during an incident or for the write up after one.
  - type: input
    id: start_time
    attributes:
      label: Incident start time (UTC)
      placeholder: "2026-11-21 14:06 UTC"
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Customer impact
      placeholder: Order API queries took longer than 10 seconds in prod-west.
    validations:
      required: true
  - type: textarea
    id: suspected_cause
    attributes:
      label: Suspected root cause
      placeholder: A filtered index was missing after release 2026.11.21.1.
    validations:
      required: true
  - type: textarea
    id: mitigation
    attributes:
      label: Mitigation taken
      placeholder: Reverted the procedure, rebuilt the index, and paused writes for 5 minutes.
    validations:
      required: true
  - type: textarea
    id: prevention
    attributes:
      label: Prevention action
      description: What automation or process change stops this from happening again?
    validations:
      required: true
