repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: dba-sql-guardrails
        name: dba-sql-guardrails
        entry: bash 05_PASS_Summit_Demos/scripts/sql_guardrails.sh
        language: system
        files: ^02_Database/changes/.*\.sql$
